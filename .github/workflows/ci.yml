name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Complete test gate
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: always
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Reserve disk for the complete test gate
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android
          df -h /
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
      - name: Fetch the private Rust style
        env:
          RUST_STYLE_TOKEN: ${{ secrets.RUST_STYLE_TOKEN }}
        run: |
          test -n "$RUST_STYLE_TOKEN"
          style_rev=$(jq -er '.nodes["rust-style"].locked.rev' devenv.lock)
          [[ "$style_rev" =~ ^[0-9a-f]{40}$ ]]
          NIX_CONFIG="access-tokens = github.com=$RUST_STYLE_TOKEN" \
            nix flake prefetch "github:cschmatzler/rust/$style_rev"
      - uses: cachix/cachix-action@97e5ff84d02b3b4f9936339f767e17f03c9252ed # v16
        with:
          name: devenv
      - name: Install devenv
        run: nix profile add github:cachix/devenv/b904dcb51fe48c30db250038241507f60752f222
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: rust-sources-v2-${{ runner.os }}-${{ hashFiles('devenv.nix', 'devenv.lock', 'Cargo.lock', 'tests/compat/rust-server/Cargo.lock') }}
          restore-keys: rust-sources-v2-${{ runner.os }}-
      - name: Run the complete test gate
        run: devenv shell -- ./scripts/check.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: test-reports
          path: |
            coverage/lcov.info
            tests/compat/client-tests/artifacts/
          if-no-files-found: warn

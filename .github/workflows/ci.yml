name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  check:
    name: Complete test gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          components: clippy,rustfmt,llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            compat-tests/rust-server
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install coverage tool
        run: cargo install cargo-llvm-cov --version 0.9.0 --locked
      - name: Install browser dependencies
        run: |
          bun install --cwd compat-tests/client-tests --frozen-lockfile
          cd compat-tests/client-tests
          bunx playwright install --with-deps chromium
      - name: Run the same gate as devenv test
        run: ./scripts/check.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            coverage/lcov.info
            compat-tests/client-tests/artifacts/
          if-no-files-found: warn

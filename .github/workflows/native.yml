name: Native tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Rust native tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: native
          POSTGRES_PASSWORD: native
          POSTGRES_DB: native
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U native"
          --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:8
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      CARGO_TERM_COLOR: always
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
      - name: Fetch the private Rust style
        env:
          RUST_STYLE_TOKEN: ${{ secrets.RUST_STYLE_TOKEN }}
        run: |
          test -n "$RUST_STYLE_TOKEN"
          style_rev=$(jq -er '.nodes["rust-style"].locked.rev' devenv.lock)
          [[ "$style_rev" =~ ^[0-9a-f]{40}$ ]]
          NIX_CONFIG="access-tokens = github.com=$RUST_STYLE_TOKEN" \
            nix flake prefetch "github:cschmatzler/rust/$style_rev"
      - uses: cachix/cachix-action@97e5ff84d02b3b4f9936339f767e17f03c9252ed # v16
        with:
          name: devenv
      - name: Install devenv
        run: nix profile add github:cachix/devenv/b904dcb51fe48c30db250038241507f60752f222
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: rust-native-sources-v1-${{ runner.os }}-${{ hashFiles('devenv.nix', 'devenv.lock', 'Cargo.lock') }}
          restore-keys: rust-native-sources-v1-${{ runner.os }}-
      - name: Run native nextest suite
        run: devenv shell -- cargo nextest run --locked
      - name: Check executable documentation
        run: devenv shell -- cargo test --locked --workspace --doc
      - name: Check lean SQLx SQLite with Axum and rustls
        run: devenv shell -- cargo check --locked -p alibi --lib --no-default-features --features rustls,axum,sqlx-sqlite
      - name: Check lean SQLx PostgreSQL with Axum and rustls
        run: devenv shell -- cargo check --locked -p alibi --lib --no-default-features --features rustls,axum,sqlx-postgres
      - name: Check SeaORM with Poem and rustls
        run: devenv shell -- cargo check --locked -p alibi --lib --no-default-features --features rustls,seaorm,poem
      - name: Check direct dispatch with native TLS
        run: devenv shell -- cargo check --locked -p alibi --lib --no-default-features --features native-tls,sqlx
      - name: Run PostgreSQL contracts for both adapters
        env:
          BETTER_AUTH_TEST_POSTGRES_URL: postgres://native:native@localhost:5432/native
        run: devenv shell -- cargo nextest run --locked --profile postgres --run-ignored only -E 'test(postgres)'
      - name: Run exact-clock admin regression proofs
        run: |
          devenv shell -- cc -shared -fPIC -o "$RUNNER_TEMP/native-clock.so" tests/compat/support/realtime-clock.c -ldl
          devenv shell -- env BETTER_AUTH_PROOF_CLOCK_MS=1893456000000 LD_PRELOAD="$RUNNER_TEMP/native-clock.so" cargo nextest run --locked --profile clock --run-ignored only -E 'test(strict_expiry)'
      - name: Run Redis persistence and atomic rate-limit contracts
        env:
          BETTER_AUTH_TEST_REDIS_URL: redis://localhost:6379/0
          TEST_RATE_LIMIT_REDIS_URL: redis://localhost:6379/0
        run: devenv shell -- cargo nextest run --locked --features redis-cache --profile redis --run-ignored only -E 'test(redis)'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: native-test-report
          path: target/nextest/*/junit.xml
          if-no-files-found: warn

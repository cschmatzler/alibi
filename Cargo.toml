[package]
name = "alibi"
description = "Authentication for Rust, compatible with Better Auth’s TypeScript client"
version = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
documentation = "https://docs.rs/alibi"
publish = ["crates-io"]
include = ["/src/**", "/README.md", "/LICENSE"]
readme = { workspace = true }
keywords = { workspace = true }
categories = { workspace = true }
[lib]
name = "alibi"

[lints]
workspace = true
[workspace]
resolver = "2"
default-members = [".", "crates/*"]
members = [
    "crates/core",
    "crates/plugins",
    "crates/macros",
    "crates/entity-codegen",
    "crates/seaorm",
    "crates/seaorm-macros",
    "crates/sqlx",
    "crates/sqlx-macros",
    "crates/schema-registry",
    "crates/cli",
]
exclude = ["tests/compat/rust-server"]
[workspace.package]
readme = "README.md"
keywords = ["auth", "authentication", "session", "oauth", "security"]
categories = ["authentication", "web-programming"]
version = "0.3.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/cschmatzler/better-auth-rs"
homepage = "https://alibi.schmatzler.com"
[workspace.dependencies]
regex = "1"
alibi-core = { version = "0.3.0", path = "crates/core" }
alibi-plugins = { version = "0.3.0", path = "crates/plugins", default-features = false }
alibi-macros = { version = "0.3.0", path = "crates/macros" }
alibi-seaorm = { version = "0.3.0", path = "crates/seaorm" }
alibi-schema-registry = { version = "0.3.0", path = "crates/schema-registry" }
alibi-entity-codegen = { version = "0.3.0", path = "crates/entity-codegen" }
alibi-sqlx = { version = "0.3.0", path = "crates/sqlx", default-features = false }
prettyplease = "0.3"
tokio = { version = "1.0", features = ["full"] }
async-trait = "0.1.92"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order", "float_roundtrip"] }
ryu-js = "1.0.3"
indexmap = { version = "2", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2.0"
chrono = { version = "0.4", features = ["serde"] }
cookie = "0.18"
uuid = { version = "1.18", features = ["v4", "v7", "serde"] }
validator = { version = "0.21", features = ["derive"] }
scrypt = "0.12"
unicode-normalization = "0.1"
rand = "0.10"
base64 = "0.23"
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto"] }
sha2 = "0.11"
sha1 = "0.11"
sha3 = "0.12"
k256 = { version = "0.14", features = ["ecdsa"] }
aes-gcm = "0.11"
ed25519-dalek = { version = "3", features = ["rand_core", "pkcs8"] }
p256 = { version = "0.14", features = ["pkcs8"] }
p521 = { version = "0.14", features = ["pkcs8"] }
rsa = { version = "0.9", features = ["sha2"] }
chacha20poly1305 = "0.11"
hkdf = "0.13"
hmac = "0.13"
totp-rs = { version = "6", features = ["gen_secret", "otpauth"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "query"] }
axum = "0.8"
http = "1"
poem = { version = "3.1.12", default-features = false }
tower = "0.5"
url = "2"
redis = "1.7"
proc-macro2 = "1"
quote = "1"
syn = { version = "3", features = ["full"] }
[features]
default = ["native-tls", "sqlx"]
native-tls = [
    "alibi-plugins/native-tls",
    "alibi-sqlx?/tls-native-tls",
    "alibi-seaorm?/tls-native-tls",
]
rustls = [
    "alibi-plugins/rustls",
    "alibi-sqlx?/tls-rustls",
    "alibi-seaorm?/tls-rustls",
]
axum = [
    "dep:axum",
    "dep:http",
    "dep:http-body-util",
    "alibi-core/axum",
    "alibi-plugins/axum",
]
poem = ["dep:poem", "dep:http"]
seaorm = ["dep:alibi-seaorm"]
sqlx = ["sqlx-sqlite", "sqlx-postgres"]
sqlx-sqlite = ["dep:alibi-sqlx", "alibi-sqlx/sqlite"]
sqlx-postgres = ["dep:alibi-sqlx", "alibi-sqlx/postgres"]
redis-cache = ["alibi-core/redis-cache"]
passkey = ["alibi-plugins/passkey"]
[dependencies]
alibi-core = { workspace = true }
alibi-plugins = { workspace = true }
alibi-seaorm = { workspace = true, optional = true }
alibi-sqlx = { workspace = true, optional = true, default-features = false }
tokio = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
multer = { version = "3.1", features = ["tokio-io"] }
axum = { workspace = true, optional = true }
poem = { workspace = true, optional = true }
http-body-util = { version = "0.1", optional = true }
http = { workspace = true, optional = true }
url = { workspace = true }
tracing = { workspace = true }
[dev-dependencies]
rsa = { workspace = true }
# Enable adapters and passkeys for repository tests without changing downstream defaults.
alibi = { path = ".", features = ["axum", "poem", "seaorm", "passkey"] }
jsonwebtoken = { workspace = true, features = ["use_pem"] }
ed25519-dalek = { workspace = true }
k256 = { workspace = true }
sha3 = { workspace = true }
totp-rs = { workspace = true }
p521 = { workspace = true }
serde_cbor_2 = "0.13.0"
axum = { workspace = true }
aes-gcm = { workspace = true }
chacha20poly1305 = { workspace = true }
hkdf = { workspace = true }
sha2 = { workspace = true }
sqlx = { version = "0.9", default-features = false, features = ["sqlite", "postgres", "chrono", "json", "derive"] }
tokio = { workspace = true, features = ["full", "test-util"] }
chrono = { workspace = true }
uuid = { workspace = true }
rand = { workspace = true }
base64 = { workspace = true }
tower = { workspace = true }
tower-http = { version = "0.7", features = ["cors"] }
tracing-subscriber = { workspace = true }
oas3 = { version = "0.22.0", features = ["yaml-spec"] }
proptest = "1.10.0"
reqwest = { workspace = true, features = ["cookies"] }
[[test]]
name = "e2e"
path = "tests/e2e/main.rs"
required-features = ["axum"]
[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Pedantic lints whose findings are not improvements for this codebase.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
module_name_repetitions = "allow"
too_many_lines = "allow"
struct_excessive_bools = "allow"
fn_params_excessive_bools = "allow"
similar_names = "allow"
large_futures = "allow"
# Selected nursery lints.
use_self = "warn"
redundant_clone = "warn"
or_fun_call = "warn"
needless_collect = "warn"
useless_let_if_seq = "warn"
equatable_if_let = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
unreachable = "warn"
indexing_slicing = "warn"
panic_in_result_fn = "warn"
undocumented_unsafe_blocks = "warn"
missing_safety_doc = "warn"
await_holding_lock = "warn"
await_holding_refcell_ref = "warn"
unused_async = "warn"
multiple_unsafe_ops_per_block = "warn"
unnecessary_safety_comment = "warn"
[workspace.lints.rust]
unfulfilled_lint_expectations = "warn"
unreachable_pub = "warn"
unused_results = "warn"
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
incremental = false
debug = false
[profile.dev.package.scrypt]
opt-level = 3
[profile.dev.package.salsa20]
opt-level = 3
[profile.ci]
inherits = "release"
opt-level = 2
lto = "thin"
codegen-units = 16
[profile.dev.package.rsa]
opt-level = 3
[profile.dev.package.num-bigint-dig]
opt-level = 3

[package.metadata.docs.rs]
features = ["axum", "poem", "seaorm", "redis-cache", "passkey"]

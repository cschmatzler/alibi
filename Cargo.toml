[package]
name = "better-auth"
description = "The most comprehensive authentication framework for Rust"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
readme = { workspace = true }
keywords = { workspace = true }
categories = { workspace = true }
[lints]
workspace = true
[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/api",
    "crates/derive",
    "crates/entity-codegen",
    "crates/seaorm",
    "crates/seaorm-macros",
    "crates/sqlx",
    "crates/sqlx-macros",
    "crates/schema-registry",
    "crates/cli",
    "vendor/webauthn-rs-core",
    "vendor/webauthn-rs",
]
exclude = ["tests/compat/rust-server"]
[workspace.package]
readme = "README.md"
keywords = ["auth", "authentication", "session", "oauth", "security"]
categories = ["authentication", "web-programming"]
version = "1.0.0-alpha.3"
edition = "2024"
license = "MIT"
repository = "https://github.com/cschmatzler/better-auth-rs"
[workspace.dependencies]
regex = "1"
better-auth-core = { version = "1.0.0-alpha.3", path = "crates/core" }
better-auth-api = { version = "1.0.0-alpha.3", path = "crates/api", default-features = false }
better-auth-macros = { version = "1.0.0-alpha.3", path = "crates/derive", package = "better-auth-macros" }
better-auth-seaorm = { version = "1.0.0-alpha.3", path = "crates/seaorm" }
better-auth-schema-registry = { version = "1.0.0-alpha.3", path = "crates/schema-registry" }
better-auth-entity-codegen = { version = "1.0.0-alpha.3", path = "crates/entity-codegen" }
better-auth-sqlx = { version = "1.0.0-alpha.3", path = "crates/sqlx", default-features = false }
prettyplease = "0.3"
tokio = { version = "1.0", features = ["full"] }
async-trait = "0.1.92"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order", "float_roundtrip"] }
ryu-js = "1.0.3"
indexmap = { version = "2", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2.0"
chrono = { version = "0.4", features = ["serde"] }
cookie = "0.18"
uuid = { version = "1.18", features = ["v4", "v7", "serde"] }
validator = { version = "0.21", features = ["derive"] }
scrypt = "0.12"
unicode-normalization = "0.1"
rand = "0.10"
base64 = "0.23"
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto"] }
sha2 = "0.11"
sha1 = "0.11"
sha3 = "0.12"
k256 = { version = "0.14", features = ["ecdsa"] }
aes-gcm = "0.11"
ed25519-dalek = { version = "3", features = ["rand_core", "pkcs8"] }
p256 = { version = "0.14", features = ["pkcs8"] }
p521 = { version = "0.14", features = ["pkcs8"] }
rsa = { version = "0.9", features = ["sha2"] }
chacha20poly1305 = "0.11"
hkdf = "0.13"
hmac = "0.13"
totp-rs = { version = "6", features = ["gen_secret", "otpauth"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "query"] }
axum = "0.8"
poem = { version = "3.1.12", default-features = false }
tower = "0.5"
url = "2"
redis = "1.7"
proc-macro2 = "1"
quote = "1"
syn = { version = "3", features = ["full"] }
[features]
default = ["native-tls", "sqlx"]
native-tls = [
    "better-auth-api/native-tls",
    "better-auth-sqlx?/tls-native-tls",
    "better-auth-seaorm?/tls-native-tls",
]
rustls = [
    "better-auth-api/rustls",
    "better-auth-sqlx?/tls-rustls",
    "better-auth-seaorm?/tls-rustls",
]
axum = [
    "dep:axum",
    "dep:tower",
    "dep:http-body-util",
    "better-auth-core/axum",
    "better-auth-api/axum",
]
poem = ["dep:poem"]
seaorm = ["dep:better-auth-seaorm"]
sqlx = ["sqlx-sqlite", "sqlx-postgres"]
sqlx-sqlite = ["dep:better-auth-sqlx", "better-auth-sqlx/sqlite"]
sqlx-postgres = ["dep:better-auth-sqlx", "better-auth-sqlx/postgres"]
redis-cache = ["better-auth-core/redis-cache"]
[dependencies]
better-auth-core = { workspace = true }
better-auth-api = { workspace = true }
better-auth-seaorm = { workspace = true, optional = true }
better-auth-sqlx = { workspace = true, optional = true, default-features = false }
tokio = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = "0.9"
multer = { version = "3.1", features = ["tokio-io"] }
clap = { version = "4.6", features = ["derive"] }
thiserror = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
rand = { workspace = true }
base64 = { workspace = true }
jsonwebtoken = { workspace = true }
axum = { workspace = true, optional = true }
poem = { workspace = true, optional = true }
tower = { workspace = true, optional = true }
url = { workspace = true }
tracing.workspace = true
http-body-util = { version = "0.1", optional = true }
[dev-dependencies]
axum = { workspace = true }
aes-gcm = { workspace = true }
chacha20poly1305 = { workspace = true }
hkdf = { workspace = true }
sha2 = { workspace = true }
better-auth-seaorm = { workspace = true }
better-auth-sqlx = { workspace = true }
sqlx = { version = "0.9", default-features = false, features = ["sqlite", "postgres", "chrono", "json", "derive"] }
tokio = { workspace = true, features = ["full", "test-util"] }
serde_yaml = "0.9"
multer = { version = "3.1", features = ["tokio-io"] }
tower-http = { version = "0.7", features = ["cors"] }
tracing-subscriber = { workspace = true }
oas3 = { version = "0.22.0", features = ["yaml-spec"] }
proptest = "1.10.0"
reqwest = { workspace = true }
[[bin]]
name = "sync_better_auth_openapi"
path = "scripts/sync_better_auth_openapi.rs"
[[bin]]
name = "openapi_alignment_report"
path = "scripts/openapi_alignment_report.rs"
[workspace.lints.clippy]
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
unreachable = "warn"
indexing_slicing = "warn"
panic_in_result_fn = "warn"
undocumented_unsafe_blocks = "warn"
missing_safety_doc = "warn"
await_holding_lock = "warn"
await_holding_refcell_ref = "warn"
unused_async = "warn"
multiple_unsafe_ops_per_block = "warn"
unnecessary_safety_comment = "warn"
[workspace.lints.rust]
unfulfilled_lint_expectations = "warn"
unreachable_pub = "warn"
unused_results = "warn"
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
incremental = false
debug = false
[profile.dev.package.scrypt]
opt-level = 3
[profile.dev.package.salsa20]
opt-level = 3
[profile.ci]
inherits = "release"
opt-level = 2
lto = "thin"
codegen-units = 16
[profile.dev.package.rsa]
opt-level = 3
[profile.dev.package.num-bigint-dig]
opt-level = 3

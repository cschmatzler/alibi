[package]
name = "compat-rust-server"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
better-auth = { path = "../..", features = ["axum", "seaorm2"] }
better-auth-core = { path = "../../crates/core" }
better-auth-seaorm = { path = "../../crates/seaorm" }
tokio = { version = "1", features = ["full"] }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1.89"
base64 = "0.22"
sha2 = "0.10"
chrono = "0.4.44"
url = "2.5.8"
reqwest = { version = "0.12", default-features = false, features = ["json"] }

# Optimize the pinned memory-hard primitive for debug compatibility fixtures.
[profile.dev.package.scrypt]
opt-level = 3

[profile.dev.package.salsa20]
opt-level = 3

[profile.dev.package.rsa]
opt-level = 3

[profile.dev.package.num-bigint-dig]
opt-level = 3

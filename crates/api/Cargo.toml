[package]
name = "better-auth-api"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
description = "Plugin implementations for better-auth"
repository = { workspace = true }

readme = { workspace = true }
keywords = { workspace = true }
categories = { workspace = true }

[lints]
workspace = true

[dependencies]
better-auth-core = { workspace = true }

# Asynchronous runtime
async-trait = { workspace = true }
tokio = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
ryu-js = { workspace = true }

# Validation
validator = { workspace = true }

# Time handling
chrono = { workspace = true }

# Cookie handling
cookie = { workspace = true }

# Data structures
uuid = { workspace = true }
indexmap = { workspace = true }

# Crypto
sha1 = { workspace = true }
sha2 = { workspace = true }
sha3 = { workspace = true }
k256 = { workspace = true }
aes-gcm = { workspace = true }
ed25519-dalek = { workspace = true }
p256 = { workspace = true }
p521 = { workspace = true }
rsa = { workspace = true }
chacha20poly1305 = { workspace = true }
hkdf = { workspace = true }
hmac = { workspace = true }
rand = { workspace = true }
base64 = { workspace = true }
totp-rs = { workspace = true }

# Logging
tracing = { workspace = true }

# HTTP client
reqwest = { workspace = true }

# URL
url = { workspace = true }
urlencoding = "2"
bon = "3.3"
jsonwebtoken.workspace = true
serde_with = "3.18.0"
webauthn-rs = { version = "0.5.4", features = ["conditional-ui", "danger-allow-state-serialisation", "danger-credential-internals"] }
webauthn-rs-core = "=0.5.4"
serde_cbor_2 = "0.13.0"
serde_path_to_error = "0.1.20"

[dev-dependencies]
# Path-only on purpose: better-auth-seaorm depends on better-auth-core, so a
# versioned dev-dependency here would constrain publish order. Cargo drops
# dev-dependencies without a version from the published manifest.
better-auth-seaorm = { path = "../seaorm" }

[features]
default = ["native-tls"]
native-tls = ["reqwest/default-tls"]
rustls = ["reqwest/rustls-tls"]
axum = ["better-auth-core/axum"]

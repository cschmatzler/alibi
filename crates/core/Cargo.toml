[package]
name = "alibi-core"
version = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
license = { workspace = true }
description = "Shared authentication contracts and backend-independent services for Alibi"
repository = { workspace = true }
homepage = { workspace = true }
documentation = "https://docs.rs/alibi-core"
publish = ["crates-io"]
include = ["/src/**", "/migrations/**", "/README.md", "/LICENSE"]

readme = { workspace = true }
keywords = { workspace = true }
categories = { workspace = true }

[lib]
name = "better_auth_core"

[lints]
workspace = true

[dependencies]
hybrid-array = "0.4"
# Asynchronous runtime
tokio = { workspace = true }
async-trait = { workspace = true }
futures-util = { version = "0.3.32", default-features = false, features = ["std"] }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
ryu-js = { workspace = true }
indexmap = { workspace = true }

# Error handling
thiserror = { workspace = true }

# Validation
validator = { workspace = true }

# Time handling
chrono = { workspace = true }

# Data structures
uuid = { workspace = true }

# Cookie parsing
cookie = { workspace = true }
percent-encoding = "2"

# Pattern matching
glob-match = "0.2.1"
regex = { workspace = true }
# Crypto
scrypt = { workspace = true }
unicode-normalization = { workspace = true }
rand = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
jsonwebtoken = { workspace = true }
aes-gcm = { workspace = true }
hkdf = { workspace = true }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

# Cache (optional)
redis = { workspace = true, optional = true }

better-auth-macros = { workspace = true }
better-auth-schema-registry = { workspace = true }
axum = { workspace = true, optional = true }
url = { workspace = true }
tracing.workspace = true

[features]
default = []
redis-cache = ["dep:redis"]
axum = ["dep:axum"]

[package.metadata.docs.rs]
all-features = true

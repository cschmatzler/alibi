[package]
name = "compat-rust-server"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
better-auth = { package = "alibi", path = "../../..", features = ["axum", "seaorm"] }
better-auth-core = { package = "alibi-core", path = "../../../crates/core" }
better-auth-seaorm = { package = "alibi-seaorm", path = "../../../crates/seaorm" }
better-auth-sqlx = { package = "alibi-sqlx", path = "../../../crates/sqlx" }
sqlx = { version = "0.9", default-features = false, features = ["sqlite", "chrono", "json", "derive"] }
tokio = { version = "1", features = ["full"] }
axum = "0.8"
futures-util = "0.3"
tower = { version = "0.5", features = ["util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1.89"
base64 = "0.23"
sha2 = "0.11"
hmac = "0.13"
chrono = "0.4.44"
url = "2.5.8"
reqwest = { version = "0.13", default-features = false, features = ["json"] }

[features]
# Serve every fixture from the SeaORM store instead of the default SQLx store.
# The name matches the library feature, so the fixture model shared with the
# root crate's integration tests selects the same backend in both crates.
seaorm = []

# Optimize the pinned memory-hard primitive for debug compatibility fixtures.
[profile.dev.package.scrypt]
opt-level = 3

[profile.dev.package.salsa20]
opt-level = 3

[profile.dev.package.rsa]
opt-level = 3

[profile.dev.package.num-bigint-dig]
opt-level = 3

# The fixture exercises production HTTP paths. Optimize the entire server and
# its dependencies, not just the outer scrypt crate, without changing algorithms.
[profile.dev]
opt-level = 2
